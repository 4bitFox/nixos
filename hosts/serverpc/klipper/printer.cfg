[gcode_macro start]
description = start gcode
gcode = 
	
	
	
	{% set bed_temp = params.BED_TEMP|default(60)|float %}
	{% set print_temp = params.PRINT_TEMP|default(200)|float %}
	{% set initial_layer_height = params.INITIAL_LAYER_HEIGHT|default(0.3)|float %}
	
	M82
	M140 S{bed_temp}
	M190 S{bed_temp}
	
	M104 S{print_temp} T0
	
	G28
	G90
	
	G0 F3000
	G1 X40 Y-5
	G1 Z{initial_layer_height}
	
	M105
	M109 S{print_temp} T0
	G4 P15000
	
	G92 E-32
	G1 E12 F300
	G1 X55 Y-5
	G1 X175 E20
	G1 Z1 F6000
	
	G92 E0

[gcode_macro end]
description = end gcode
gcode = 
	
	
	
	G92 E1
	G1 E-10 F600
	
	M104 S0
	M140 S0
	
	G0 F3000
	
	G91
	G1 Z1
	G90
	
	G1 X20 Y230

[gcode_macro idle_timeout]
description = custom idle_timeout
gcode = 
	SET_HEATER_TEMPERATURE HEATER=extruder

[gcode_macro tram_z]
description = move to position to tram X-carriage
gcode = 
	{% set park_x = params.PARK_X|default(240)|float %}
	{% set park_y = params.PARK_Y|default(-12)|float %}
	{% set park_z = params.PARK_X|default(-2)|float %}
	
	{% set feed_xy = params.FEED_X|default(3000)|float %}
	{% set feed_z = params.PARK_X|default(100)|float %}
	
	
	G0 F{feed_xy}
	G1 X{park_x}
	G1 Y{park_y}
	
	G0 F{feed_z}
	G1 Z{park_z}
	
	M84

[gcode_macro calibrate_input_shaper]
description = prepare to calibrate input shaper using tuning tower
gcode = 
	{% set velocity_limit = params.VELOCITY_LIMIT|default(7000)|float %}
	{% set accel_start = params.ACCEL_START|default(1500)|float %}
	{% set step_delta = params.STEP_DELTA|default(500)|float %}
	{% set step_height = params.STEP_HEIGHT|default(5)|float %}
	
	SET_VELOCITY_LIMIT ACCEL_TO_DECEL={velocity_limit}
	SET_PRESSURE_ADVANCE ADVANCE=0
	TUNING_TOWER COMMAND=SET_VELOCITY_LIMIT PARAMETER=ACCEL START={accel_start} STEP_DELTA={step_delta} STEP_HEIGHT={step_height}

[gcode_macro calibrate_pid_extruder]
description = pid tune extruder
gcode = 
	{% set temp_target = params.TEMP_TARGET|default(250)|float %}
	PID_CALIBRATE HEATER=extruder TARGET={temp_target}

[gcode_macro calibrate_pid_bed]
description = pid tune bed
gcode = 
	{% set temp_target = params.TEMP_TARGET|default(100)|float %}
	PID_CALIBRATE HEATER=heater_bed TARGET={temp_target}

[gcode_macro skew_correction_set]
description = set skew correction
gcode = 
	{% set xy_ac = params.XY_AC|default(140.7)|float %}
	{% set xy_bd = params.XY_BD|default(142.0)|float %}
	{% set xy_ad = params.XY_AD|default(100.1)|float %}
	
	{% set xz_ac = params.XZ_AC|default(141.2)|float %}
	{% set xz_bd = params.XZ_BD|default(141.9)|float %}
	{% set xz_ad = params.XZ_AD|default(100.1)|float %}
	
	{% set yz_ac = params.YZ_AC|default(140.0)|float %}
	{% set yz_bd = params.YZ_BD|default(140.0)|float %}
	{% set yz_ad = params.YZ_AD|default(100.0)|float %}
	
	SET_SKEW XY={xy_ac},{xy_bd},{xy_ad} XZ={xz_ac},{xz_bd},{xz_ad} YZ={yz_ac},{yz_bd},{yz_ad}
	GET_CURRENT_SKEW

[gcode_macro skew_correction_clear]
description = clears skew correction
gcode = 
	SET_SKEW CLEAR=1

